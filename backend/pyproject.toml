[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adrf>=0.1.13",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "google-genai>=2.16.0",
    "groq>=1.6.0",
    "pgvector>=0.5.0",
    "psycopg>=3.3.4",
    "redis<5",
    "uvicorn>=0.52.1",
    "whitenoise[brotli]>=6.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

# Pinned explicitly. With no config, ruff applies its own version default,
# which means upgrading ruff can change which rules run and turn CI red without
# anyone touching the code. Stating the set makes lint results reproducible.
[tool.ruff]
target-version = "py313"

# Migrations are generated by Django, not written by hand. Linting them
# produces noise nobody will ever act on.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E4",   # imports (includes E402, which core/asgi.py deliberately violates)
    "E7",
    "E9",
    "F",    # pyflakes (includes F403/F405 for the settings star-imports)
    "I",    # import sorting
    "B",    # bugbear — real bug patterns, not style
    "UP",   # pyupgrade
    "DJ",   # Django-specific correctness
    "RUF",
]

ignore = [
    # "Mutable class attributes should be annotated with typing.ClassVar".
    # Fights Django on its own turf: every `fields`, `list_display`, and
    # `permission_classes` trips it. 28 hits in this codebase, all false
    # positives against normal Django style.
    "RUF012",
]

# --------------------------------------------------------------------------
# KNOWN LINT DEBT — recorded 2026-08-21, to be worked off, not left here.
#
# These are per-file rather than global on purpose: each entry names a real
# file and a real rule, so the list shrinks visibly as things get fixed and
# cannot quietly grow to cover new code. Deleting an entry and watching CI
# stay green is the definition of done.
#
# DJ001 is the one that actually matters. `null=True` on a string field gives
# you two different ways to represent "empty" — NULL and "" — so every filter,
# every serializer, and every template has to handle both. Django's own
# guidance is `blank=True` alone for string fields.
#
# The rest are cosmetic: DJ012 is inner-class ordering, RUF005 prefers
# unpacking over list concatenation, RUF002 is an en-dash in a docstring.
# --------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
"apps/chat/models.py" = ["DJ001"]
"apps/products/models.py" = ["DJ001", "DJ012"]
"apps/chat/services/chat_service.py" = ["RUF005"]
"apps/chat/services/providers/base.py" = ["RUF002"]

[tool.ruff.format]
# Formatting-only debt, same deal: these three predate the format check and
# are excluded so CI is green today. Run `ruff format` on them and delete the
# entry — the diff is whitespace, nothing to review.
exclude = [
    "apps/chat/consumers.py",
    "apps/chat/services/chat_service.py",
    "apps/chat/management/commands/test_stream.py",
]
