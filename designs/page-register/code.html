</div>
<div class="flex-1">
<label class="sr-only" for="lastName">Last Name</label>
<input class="w-full h-12 bg-bg-cream text-on-background font-body-base text-body-base px-4 outline-none focus:bg-surface-container transition-colors rounded-none placeholder:text-text-muted" id="lastName" name="lastName" placeholder="Last Name" required="" type="text"/>
</div>
</div>
<div>
<label class="sr-only" for="email">Email</label>
<input class="w-full h-12 bg-bg-cream text-on-background font-body-base text-body-base px-4 outline-none focus:bg-surface-container transition-colors rounded-none placeholder:text-text-muted" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
<div class="relative">
<label class="sr-only" for="password">Password</label>
<input class="w-full h-12 bg-bg-cream text-on-background font-body-base text-body-base px-4 pr-12 outline-none focus:bg-surface-container transition-colors rounded-none placeholder:text-text-muted" id="password" name="password" placeholder="Password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-on-background transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility_off</span>
</button>
</div>
<div class="flex flex-col gap-1 mt-1 mb-2">
<div class="flex h-1 w-full gap-1">
<div class="h-full flex-1 bg-surface-container-high transition-colors duration-300" id="strength-1"></div>
<div class="h-full flex-1 bg-surface-container-high transition-colors duration-300" id="strength-2"></div>
<div class="h-full flex-1 bg-surface-container-high transition-colors duration-300" id="strength-3"></div>
<div class="h-full flex-1 bg-surface-container-high transition-colors duration-300" id="strength-4"></div>
</div>
<p class="font-body-xs text-body-xs text-text-muted" id="passwordHint">8+ characters, uppercase, number</p>
</div>
<div>
<label class="sr-only" for="confirmPassword">Confirm Password</label>
<input class="w-full h-12 bg-bg-cream text-on-background font-body-base text-body-base px-4 outline-none focus:bg-surface-container transition-colors rounded-none placeholder:text-text-muted" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required="" type="password"/>
</div>
<div class="mt-6 mb-4">
<h3 class="font-body-sm text-body-sm text-text-muted mb-4 uppercase tracking-widest">Tell us your style (optional)</h3>
<div class="flex flex-wrap gap-2" id="stylePreferences">
<button aria-pressed="false" class="style-chip px-4 py-2 font-body-sm text-body-sm text-on-background bg-transparent border border-border hover:bg-surface-container-high transition-colors rounded-none aria-[pressed=true]:bg-tertiary aria-[pressed=true]:text-on-tertiary aria-[pressed=true]:border-tertiary" type="button">Casual</button>
<button aria-pressed="false" class="style-chip px-4 py-2 font-body-sm text-body-sm text-on-background bg-transparent border border-border hover:bg-surface-container-high transition-colors rounded-none aria-[pressed=true]:bg-tertiary aria-[pressed=true]:text-on-tertiary aria-[pressed=true]:border-tertiary" type="button">Formal</button>
<button aria-pressed="false" class="style-chip px-4 py-2 font-body-sm text-body-sm text-on-background bg-transparent border border-border hover:bg-surface-container-high transition-colors rounded-none aria-[pressed=true]:bg-tertiary aria-[pressed=true]:text-on-tertiary aria-[pressed=true]:border-tertiary" type="button">Bohemian</button>
<button aria-pressed="false" class="style-chip px-4 py-2 font-body-sm text-body-sm text-on-background bg-transparent border border-border hover:bg-surface-container-high transition-colors rounded-none aria-[pressed=true]:bg-tertiary aria-[pressed=true]:text-on-tertiary aria-[pressed=true]:border-tertiary" type="button">Streetwear</button>
<button aria-pressed="false" class="style-chip px-4 py-2 font-body-sm text-body-sm text-on-background bg-transparent border border-border hover:bg-surface-container-high transition-colors rounded-none aria-[pressed=true]:bg-tertiary aria-[pressed=true]:text-on-tertiary aria-[pressed=true]:border-tertiary" type="button">Minimalist</button>
<button aria-pressed="false" class="style-chip px-4 py-2 font-body-sm text-body-sm text-on-background bg-transparent border border-border hover:bg-surface-container-high transition-colors rounded-none aria-[pressed=true]:bg-tertiary aria-[pressed=true]:text-on-tertiary aria-[pressed=true]:border-tertiary" type="button">Traditional</button>
</div>
</div>
<div class="flex items-start gap-3 mt-4 mb-8">
<div class="relative flex items-center mt-1">
<input class="peer appearance-none w-5 h-5 bg-bg-cream checked:bg-tertiary transition-colors cursor-pointer rounded-none" id="terms" name="terms" required="" type="checkbox"/>
<span class="material-symbols-outlined absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-on-tertiary text-[16px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<label class="font-body-sm text-body-sm text-on-background cursor-pointer select-none" for="terms">
          I agree to the <a class="underline underline-offset-4 hover:text-text-muted transition-colors" href="#">Terms of Service</a> and <a class="underline underline-offset-4 hover:text-text-muted transition-colors" href="#">Privacy Policy</a>
</label>
</div>
<button class="w-full h-12 bg-tertiary text-on-tertiary font-label-caps text-label-caps uppercase hover:bg-inverse-surface transition-colors rounded-none flex items-center justify-center gap-2 group" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[18px] transform group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="flex items-center gap-4 my-6">
<div class="h-px bg-border flex-1"></div>
<span class="font-body-xs text-body-xs text-text-muted uppercase tracking-widest">or</span>
<div class="h-px bg-border flex-1"></div>
</div>
<button class="w-full h-12 bg-transparent text-on-background font-label-caps text-label-caps uppercase border border-border hover:bg-surface-container transition-colors rounded-none flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
        Continue with Google
      </button>
</form>
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-text-muted">
        Already have an account? <a class="text-on-background underline underline-offset-4 hover:text-text-muted transition-colors ml-1 font-medium" href="#">Sign in</a>
</p>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Password toggle
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
    });

    // Password strength
    const passwordField = document.getElementById('password');
    const s1 = document.getElementById('strength-1');
    const s2 = document.getElementById('strength-2');
    const s3 = document.getElementById('strength-3');
    const s4 = document.getElementById('strength-4');
    const hint = document.getElementById('passwordHint');

    passwordField.addEventListener('input', (e) => {
      const val = e.target.value;
      let strength = 0;
      
      if (val.length >= 8) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const resetColors = () => {
        [s1, s2, s3, s4].forEach(el => el.className = 'h-full flex-1 bg-surface-container-high transition-colors duration-300');
      };

      resetColors();

      if (val.length === 0) {
        hint.style.color = '';
        return;
      }

      if (strength <= 1) {
        s1.classList.replace('bg-surface-container-high', 'bg-error');
        hint.style.color = 'var(--error)';
      } else if (strength === 2) {
        s1.classList.replace('bg-surface-container-high', 'bg-secondary-fixed-dim');
        s2.classList.replace('bg-surface-container-high', 'bg-secondary-fixed-dim');
        hint.style.color = 'var(--secondary-container)';
      } else if (strength >= 3) {
        s1.classList.replace('bg-surface-container-high', 'bg-success');
        s2.classList.replace('bg-surface-container-high', 'bg-success');
        s3.classList.replace('bg-surface-container-high', 'bg-success');
        if (strength === 4) s4.classList.replace('bg-surface-container-high', 'bg-success');
        hint.style.color = 'var(--success)';
      }
    });

    // Style chips toggle
    const chips = document.querySelectorAll('.style-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isPressed = chip.getAttribute('aria-pressed') === 'true';
        chip.setAttribute('aria-pressed', !isPressed);
      });
    });
  });
</script></main></body></html>
