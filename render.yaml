# Render Blueprint — infrastructure as code.
#
# Point Render at this repo and it reads this file instead of you filling in a
# dashboard form. The config lives in git, gets reviewed like code, and can be
# rebuilt from scratch if the service is ever deleted.
#
# Note there is no database entry here on purpose. Render's own free Postgres
# is deleted 30 days after creation, which would quietly kill the demo; the
# database is Neon, configured out-of-band and supplied via DATABASE_URL.
# There is no Redis entry either — the app runs a single process and uses
# Channels' in-memory layer, so no broker is needed.

services:
  - type: web
    name: stylesense-ai
    runtime: docker
    plan: free

    # Must match the Neon project's region. Every query crosses this gap, so a
    # mismatch here (say app in Oregon, database in Singapore) adds a few
    # hundred milliseconds to every single database round trip.
    region: singapore

    dockerfilePath: ./Dockerfile
    dockerContext: .

    branch: main
    autoDeploy: true

    # Render polls this and only routes traffic to a new container once it
    # answers. A deploy that fails to boot therefore leaves the previous
    # version serving instead of taking the site down — this line is the entire
    # safety net between a bad push and a broken portfolio link.
    healthCheckPath: /healthz

    # NOTE: there is deliberately no preDeployCommand here.
    #
    # Render rejects it on the free tier ("pre-deploy command is not supported
    # for free tier services"), so migrations and catalogue seeding are run
    # manually from a local machine pointed at the Neon DATABASE_URL:
    #
    #   cd backend
    #   DATABASE_URL="<neon-pooled-url>" uv run python manage.py migrate
    #   DATABASE_URL="<neon-pooled-url>" uv run python manage.py seed_products
    #   DATABASE_URL="<neon-pooled-url>" uv run python manage.py seed_embeddings
    #
    # All three are idempotent, so re-running them is safe. The practical
    # consequence is that a deploy carrying a new migration needs that migrate
    # run BEFORE the deploy goes live, or the new code will query columns that
    # do not exist yet. Running it first is safe because Django migrations are
    # additive by default.
    #
    # Restoring the automated version is a one-line change if this ever moves
    # to a paid instance type.

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production

      # Generated by Render once and then held. Never appears in this repo.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # sync: false means "prompt me in the dashboard, do not store in git".
      # This is where the Neon POOLED connection string goes — the one routed
      # through PgBouncer, and it must end with ?sslmode=require
      - key: DATABASE_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # Global ceiling on AI calls per day, across all users.
      - key: AI_DAILY_CALL_LIMIT
        value: "200"

      - key: DJANGO_LOG_LEVEL
        value: INFO

      # Neon suspends idle compute after ~5 minutes; recycle connections well
      # inside that window so Django never reaches for a dead one.
      - key: DJANGO_CONN_MAX_AGE
        value: "120"

      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS are derived automatically from
      # RENDER_EXTERNAL_HOSTNAME in production.py, so nothing is needed here
      # unless a custom domain is added later.
